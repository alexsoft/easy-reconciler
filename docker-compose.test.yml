services:
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reconciler
      POSTGRES_PASSWORD: reconciler
      POSTGRES_DB: reconciler_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reconciler"]
      interval: 1s
      retries: 20
    tmpfs: [/var/lib/postgresql]

  test-runner:
    image: node:24-alpine
    working_dir: /app/packages/api
    environment:
      DATABASE_URL: postgres://reconciler:reconciler@db-test:5432/reconciler_test
      NODE_ENV: test
      CI: "1"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - .:/app:cached
    entrypoint: ["sh", "-c", "corepack enable >/dev/null 2>&1 && exec \"$$@\"", "--"]
